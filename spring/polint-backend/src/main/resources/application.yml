server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://postgres:5432/polint
    username: polint
    password: polint
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

polint:
  agent:
    base-url: http://agent:8000
    timeout-ms: 120000
